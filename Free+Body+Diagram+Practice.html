<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Body Diagram Practice</title>
<style>
  :root{
    --ink:#1d2433; --muted:#5b6475; --line:#d9dde5; --bg:#f6f7f9; --card:#fff; --btn:#fff; --btnh:#f1f3f5;
    --arrow:#1f4fd1; --sel:#d9480f; --flag:#c92a2a; --good:#2b8a3e; --goodbg:#ebfbee; --badbg:#fff4e6;
    --badline:#ffc078; --goodline:#8ce99a; --gbox:#f1f5ff; --gline:#c5d3f7; --ghead:#3b5bdb;
    --sbox:#fff9db; --sline:#ffe066; --shead:#a07800; --hover:#edf2ff; --flagbg:#ffe3e3; --axis:#7048e8;
  }
  body.dark{
    --ink:#e9ecef; --muted:#adb5bd; --line:#3a3f47; --bg:#121417; --card:#1c1f24; --btn:#262a31; --btnh:#30353d;
    --arrow:#5c8dff; --goodbg:#13301d; --badbg:#3a2a12; --badline:#8a5a1c; --goodline:#2f6f43;
    --gbox:#1d2742; --gline:#33467a; --ghead:#9db4ff; --sbox:#3a3212; --sline:#6b5a1a; --shead:#ffd866; --hover:#2a3350; --flagbg:#4a1f1f;
  }
  body.dark .stage{border-color:#3a3f47}
  body.dark svg#scene{filter:brightness(.88)}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.45}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line)}
  header h1{font-size:19px;margin:0}
  header .lvl{font-size:13px;color:var(--muted)}
  .tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .tabs .pick{font-size:13px;color:var(--muted);margin-right:2px}
  .tabs button{font-size:13px;padding:6px 12px;border-radius:999px}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tabs button.done::after{content:" ✓";color:var(--good);font-weight:700}
  .tabs button.on.done::after{color:#8ce99a}
  .progress{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
  .dots{display:flex;gap:6px}
  .dot{width:16px;height:16px;border-radius:50%;border:2px solid #adb5bd;background:var(--card)}
  .dot.on{background:var(--good);border-color:var(--good)}
  main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:20px 24px;max-width:1240px;margin:0 auto}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .scenario h2{margin:0 0 4px;font-size:18px}
  .scenario p{margin:0 0 12px;font-size:15.5px}
  .tag{display:inline-block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .givens{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 12px}
  .givens .box{background:var(--gbox);border:1px solid var(--gline);border-radius:8px;padding:8px 12px;font-size:14.5px}
  .givens .box b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ghead);margin-bottom:2px}
  .givens ul{margin:0;padding-left:18px}
  .givens .scale{background:var(--sbox);border-color:var(--sline)}
  .givens .scale b{color:var(--shead)}
  .stage{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;touch-action:none;user-select:none}
  svg#scene{display:block;width:100%;height:auto;cursor:crosshair}
  .status{font-size:13px;color:var(--muted);min-height:18px;margin-top:6px}
  .side h3{font-size:14px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .side ol{margin:0 0 4px;padding-left:20px;font-size:14px}
  .side li{margin-bottom:4px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  button{font:inherit;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--btn);padding:8px 14px;cursor:pointer;color:var(--ink)}
  button:hover{background:var(--btnh)}
  button.primary{background:var(--arrow);border-color:var(--arrow);color:#fff;font-weight:600}
  button.primary:hover{background:#1a43b3}
  button.go{background:var(--good);border-color:var(--good);color:#fff;font-weight:600}
  button:disabled{opacity:.4;cursor:default}
  .feedback{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:15px;display:none}
  .feedback.bad{display:block;background:var(--badbg);border:1px solid var(--badline)}
  .feedback.good{display:block;background:var(--goodbg);border:1px solid var(--goodline)}
  .feedback strong{display:block;margin-bottom:4px}
  .feedback .meta{font-size:12.5px;color:var(--muted);margin-top:6px}
  kbd{font-family:inherit;font-size:12px;border:1px solid #9db4f0;border-bottom-width:2px;border-radius:4px;padding:0 5px}
  .picker{position:absolute;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:8px;width:214px;display:none;max-height:92%;overflow:auto}
  .picker .ttl{font-size:12px;color:var(--muted);padding:2px 4px 6px}
  .picker button{display:flex;width:100%;text-align:left;border:none;padding:6px 8px;border-radius:6px;gap:8px;align-items:baseline}
  .picker button .s{font-weight:700;min-width:40px;color:var(--arrow)}
  .picker button:hover{background:var(--hover)}
  .picker button.del{color:var(--flag);border-top:1px solid var(--line);border-radius:0 0 6px 6px;margin-top:4px}
  .legend{font-size:13.5px;margin:0;padding:0;list-style:none;columns:2;column-gap:12px}
  .legend li{margin-bottom:3px}
  .legend b{color:var(--arrow)}
  details.teacher{max-width:1240px;margin:0 auto 30px;padding:0 24px;font-size:14px}
  details.teacher > div{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px 16px;margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  details.teacher summary{cursor:pointer;color:var(--muted)}
  select{font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);max-width:100%;background:var(--btn);color:var(--ink)}
  .overlay{position:fixed;inset:0;background:rgba(20,25,35,.45);display:none;align-items:center;justify-content:center;z-index:20}
  .overlay .box{background:var(--card);color:var(--ink);border-radius:14px;padding:26px 28px;max-width:460px;text-align:center}
  .overlay h2{margin:0 0 8px}
  .stepper{display:flex;align-items:center;gap:6px;margin:0 0 12px;flex-wrap:wrap}
  .stepper .st{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);padding:5px 10px;border-radius:999px;border:1px solid var(--line)}
  .stepper .st span{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink);font-size:12px;font-weight:700}
  .stepper .st.on{color:var(--ink);border-color:var(--arrow);font-weight:600}
  .stepper .st.on span{background:var(--arrow);color:#fff}
  .stepper .st.done span{background:var(--good);color:#fff}
  .stepper .sep{width:14px;height:2px;background:var(--line)}
  .checklist{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 12px;display:flex;gap:18px;flex-wrap:wrap}
  .checklist[hidden]{display:none}
  .magpanel{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 12px}
  .magpanel[hidden]{display:none}
  .magpanel .gh{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
  .magpanel .mags{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 16px}
  .magpanel .mag{display:flex;align-items:center;gap:8px;font-size:15px;padding:3px 6px;border-radius:6px}
  .magpanel .mag.flag{background:var(--flagbg);outline:2px solid var(--flag)}
  .magpanel .on{font-size:12.5px;color:var(--muted)}
  .magpanel input{width:96px;font:inherit;font-size:15px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--btn);color:var(--ink);margin-left:auto}
  .checklist .grp{flex:1 1 240px}
  .checklist .fn{white-space:nowrap}
  .checklist .gh{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
  .checklist .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 12px}
  .checklist .chk{display:flex;align-items:baseline;gap:8px;font-size:15px;padding:4px 6px;border-radius:6px;cursor:pointer}
  .checklist .chk:hover{background:var(--hover)}
  .checklist .chk.flag{background:var(--flagbg);outline:2px solid var(--flag)}
  .checklist input{width:17px;height:17px;accent-color:var(--arrow);transform:translateY(3px)}
  .checklist .nm{color:var(--muted);font-size:13.5px}
  .by{font-size:13px;color:var(--muted);font-weight:500}
  .dark-toggle{font-size:13px;padding:6px 12px;border-radius:999px}
  svg text.halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
</style>
</head>
<body>
<header>
  <div>
    <h1>Free Body Diagram Practice</h1>
    <div class="lvl" id="lvlsub"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <button id="darkToggle" class="dark-toggle" title="Switch between light and dark mode">🌙 Dark mode</button>
  <div class="progress"><span>Correct on first try:</span><div class="dots" id="dots"></div><span id="ptext">0 / 5</span></div>
</header>

<main>
  <section class="card scenario">
    <span class="tag" id="sctag"></span>
    <h2 id="sctitle"></h2>
    <p id="sctext"></p>
    <div class="stepper" id="stepper"></div>
    <div class="givens" id="givens"></div>
    <div class="checklist" id="checklist" hidden></div>
    <div class="magpanel" id="magpanel" hidden></div>
    <div class="stage" id="stage">
      <svg id="scene" viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg">
        <g id="sceneArt"></g>
        <g id="guides"></g>
        <g id="arrows"></g>
        <g id="axesLayer"></g>
      </svg>
      <div class="picker" id="picker"></div>
    </div>
    <div class="status" id="status"></div>
  </section>

  <aside class="side">
    <div class="card">
      <h3>How to draw</h3>
      <ol id="howto"></ol>
      <div class="btns">
        <button class="primary" id="submit"></button>
        <button id="clear">Clear all</button>
        <button id="skip">New situation</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Force labels</h3>
      <ul class="legend" id="legend"></ul>
    </div>
  </aside>
</main>

<details class="teacher" id="teacherPanel" hidden>
  <summary>Teacher preview (prototype only)</summary>
  <div>
    <select id="jump"></select>
    <button id="showSol">Show a correct diagram</button>
    <button id="resetProg">Reset progress</button>
    <span id="selftest" style="color:var(--muted)"></span>
  </div>
</details>

<div class="overlay" id="done">
  <div class="box">
    <h2 id="donetitle"></h2>
    <p id="donetext"></p>
    <div class="btns" style="justify-content:center">
      <button class="primary" id="nextLevel">Go on</button>
      <button id="keepGoing">Keep practicing this level</button>
    </div>
  </div>
</div>

<script>
const DIRS = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};
const LABELS = {
  Fg:   {sub:'g',   name:'Gravity (weight)'},
  FN:   {sub:'N',   name:'Normal force'},
  Ff:   {sub:'f',   name:'Friction'},
  FT:   {sub:'T',   name:'Tension'},
  Fapp: {sub:'app', name:'Applied force'},
  Fair: {sub:'air', name:'Air resistance'},
  Fb:   {sub:'b',   name:'Buoyant force'},
  Fsp:  {sub:'sp',  name:'Spring force'}
};
const sym = k => `F<sub>${LABELS[k].sub}</sub>`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* =========================================================
   GENERIC HINTS  (a scenario can override any of these)
   ========================================================= */
const GENERIC = {
  missing: {
    Fg:   o => `Something is missing. Every object near Earth's surface is pulled toward the Earth. Is that force on ${o} in your diagram?`,
    FN:   o => `Something is missing. ${cap(o)} is pressed against a surface, and a surface pushes back on anything resting or pressing on it. Add that force.`,
    FT:   o => `Something is missing. A rope, cord, cable, or string is attached to ${o} and pulled tight. Add the force it exerts.`,
    Ff:   o => `Something is missing. ${cap(o)} is sliding across a surface, and the two surfaces rub against each other. Add the force that resists sliding.`,
    Fair: o => `Something is missing. ${cap(o)} is moving through the air fast enough (or is large enough) that the air pushes back against it. Add that force.`,
    Fb:   o => `Something is missing. ${cap(o)} is surrounded by a fluid that pushes up on it. Add that force.`,
    Fsp:  o => `Something is missing. A stretched spring is attached to ${o}. Add the force the spring exerts.`,
    Fapp: o => `Something is missing. Something is directly pushing or pulling on ${o}. Add that force.`
  },
  extra: {
    Fapp: o => `There's no applied force here. An applied force needs a person or object touching ${o} and pushing or pulling it right now. Remember: an object does not need a force to keep moving.`,
    Ff:   o => `There's no friction on ${o} here. Friction only acts where two surfaces slide (or try to slide) against each other.`,
    FN:   o => `There's no normal force here. A normal force only exists where ${o} is pressed against a solid surface.`,
    FT:   o => `There's no tension here. Tension needs a rope, string, cable, or chain attached to ${o} and pulling on it.`,
    Fair: o => `Leave out air resistance here. ${cap(o)} is either not moving or moving slowly enough that air resistance is negligible.`,
    Fb:   o => `Leave out the buoyant force here. Air does push up very slightly on everything, but for ${o} it is negligible.`,
    Fsp:  o => `There's no spring attached to ${o}.`,
    Fg:   o => `Check your labels.`
  },
  dir: {
    Fg:   o => `Check the direction of ${sym('Fg')}. Gravity always pulls straight down, toward the center of the Earth.`,
    FN:   o => `Check the direction of ${sym('FN')}. A normal force pushes <em>away</em> from the surface, perpendicular to it. A surface can push, but it can't pull.`,
    Ff:   o => `Check the direction of ${sym('Ff')}. Friction acts opposite to the direction ${o} is sliding.`,
    FT:   o => `Check the direction of ${sym('FT')}. A rope can only pull, never push: tension points along the rope, away from ${o}.`,
    Fair: o => `Check the direction of ${sym('Fair')}. Air resistance always opposes motion, so it points opposite to the direction ${o} is moving.`,
    Fb:   o => `Check the direction of ${sym('Fb')}. A fluid pushes harder on the bottom of an object than on the top, so the buoyant force points up.`,
    Fsp:  o => `Check the direction of ${sym('Fsp')}. A stretched spring pulls ${o} back toward the spring.`,
    Fapp: o => `Check the direction of ${sym('Fapp')}. Which way is the push or pull?`
  }
};

/* =========================================================
   SCENE DRAWING HELPERS
   ========================================================= */
function sky(a='#9fd0f0', b='#e6f4fc'){
  return `<defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="640" height="440" fill="url(#skyg)"/>`;
}
function cloud(x,y,s=1){
  return `<g transform="translate(${x} ${y}) scale(${s})" fill="#fff" opacity=".92"><ellipse cx="0" cy="0" rx="42" ry="15"/><ellipse cx="-20" cy="-8" rx="22" ry="15"/><ellipse cx="14" cy="-13" rx="25" ry="19"/></g>`;
}
function motion(dir, x, y, note, col='#495057'){
  const [dx,dy] = DIRS[dir], L = 96;
  const x2 = x+dx*L, y2 = y+dy*L, px = -dy, py = dx;
  const head = `${x2},${y2} ${x2-dx*13+px*7},${y2-dy*13+py*7} ${x2-dx*13-px*7},${y2-dy*13-py*7}`;
  const horiz = dx !== 0;
  const tx = horiz ? (x+x2)/2 : x+14, ty = horiz ? y-26 : Math.min(y,y2)+36;
  const anchor = horiz ? 'middle' : 'start';
  return `<g pointer-events="none">
    <line x1="${x}" y1="${y}" x2="${x2-dx*11}" y2="${y2-dy*11}" stroke="${col}" stroke-width="3" stroke-dasharray="7 5"/>
    <polygon points="${head}" fill="${col}"/>
    <text class="halo" x="${tx}" y="${ty}" text-anchor="${anchor}" font-size="14" font-weight="700" fill="#343a40">motion</text>
    ${note ? `<text class="halo" x="${tx}" y="${ty+16}" text-anchor="${anchor}" font-size="12.5" fill="#495057">${note}</text>` : ''}
  </g>`;
}
function room(){ return `<rect width="640" height="440" fill="#efe7da"/><rect y="404" width="640" height="36" fill="#c4b190"/><rect y="400" width="640" height="5" fill="#a8946f"/>`; }

function elevator(motionDir, note, floor){
  return `<rect width="640" height="440" fill="#5c636e"/>
    <rect x="180" y="0" width="280" height="440" fill="#4a5059"/>
    <line x1="290" y1="0" x2="290" y2="70" stroke="#222" stroke-width="3"/><line x1="350" y1="0" x2="350" y2="70" stroke="#222" stroke-width="3"/>
    <rect x="196" y="66" width="248" height="350" rx="4" fill="#e9e4d8" stroke="#2b2f36" stroke-width="5"/>
    <rect x="196" y="398" width="248" height="18" fill="#8d8170"/>
    <rect x="292" y="78" width="56" height="22" rx="3" fill="#1b1e23"/>
    <text x="320" y="95" text-anchor="middle" font-size="15" font-family="monospace" fill="#ffb84d">${floor}</text>
    <rect x="410" y="200" width="18" height="44" rx="3" fill="#c9c2b2"/><circle cx="419" cy="212" r="4" fill="#666"/><circle cx="419" cy="230" r="4" fill="#666"/>
    <!-- person -->
    <circle cx="320" cy="140" r="19" fill="#e8b48a"/>
    <path d="M301 132 q19 -26 38 0 q-4 -14 -19 -14 q-15 0 -19 14z" fill="#3b2a20"/>
    <rect x="299" y="162" width="42" height="104" rx="10" fill="#3d7bc4"/>
    <rect x="288" y="168" width="11" height="80" rx="5" fill="#3d7bc4"/><rect x="341" y="168" width="11" height="80" rx="5" fill="#3d7bc4"/>
    <rect x="302" y="262" width="16" height="134" rx="5" fill="#2f3542"/><rect x="322" y="262" width="16" height="134" rx="5" fill="#2f3542"/>
    <rect x="296" y="390" width="24" height="9" rx="3" fill="#111"/><rect x="320" y="390" width="24" height="9" rx="3" fill="#111"/>
    ${motion(motionDir, 520, motionDir==='up'?300:130, note, '#f1f3f5')}`;
}

/* =========================================================
   SCENARIOS – LEVEL 1
   forces: label, dir, len (len = a sample correct length, used by
           "show a correct diagram"; grading uses net force + relations)
   net:    sign of the net force on each axis (x: +right, y: +up)
   rel:    extra length comparisons that must hold
   ========================================================= */
const L1 = [
{
  id:'book', title:'Textbook on a desk', obj:'the textbook', c:[320,221], still:'at rest',
  text:'Your chemistry textbook is lying flat on top of your desk. Nobody is touching it. Draw the forces acting on the <b>textbook</b>.',
  forces:[{label:'Fg',dir:'down',len:4},{label:'FN',dir:'up',len:4}],
  net:{x:0,y:0},
  extra:{Ff:o=>`There's no friction here. Friction acts only when surfaces slide (or try to slide) against each other — nothing is trying to slide the book across the desk.`},
  explain:`Gravity pulls the book down and the desk pushes up with a normal force. The book is at rest, so the two forces balance: ${sym('FN')} = ${sym('Fg')}.`,
  scene:()=>`${room()}
    <rect x="70" y="40" width="130" height="95" fill="#d9e8f2" stroke="#b9a68a" stroke-width="6"/>
    <rect x="120" y="238" width="400" height="16" rx="3" fill="#8a5a3b"/>
    <rect x="140" y="254" width="16" height="148" fill="#6e4630"/><rect x="484" y="254" width="16" height="148" fill="#6e4630"/>
    <rect x="156" y="254" width="120" height="70" fill="#7a4e33"/><rect x="200" y="282" width="32" height="6" rx="3" fill="#c9a37a"/>
    <rect x="250" y="204" width="140" height="34" rx="4" fill="#2d6a8a"/>
    <rect x="256" y="210" width="134" height="22" fill="#f6f1e4"/>
    <line x1="258" y1="216" x2="388" y2="216" stroke="#d8cfb8"/><line x1="258" y1="221" x2="388" y2="221" stroke="#d8cfb8"/><line x1="258" y1="226" x2="388" y2="226" stroke="#d8cfb8"/>
    <rect x="430" y="196" width="10" height="42" rx="2" fill="#e8a33d"/><path d="M430 196 l5 -10 l5 10z" fill="#f2d3a3"/>`
},
{
  id:'plant', title:'Hanging plant', obj:'the plant and pot', c:[320,222], still:'at rest',
  text:'A potted plant hangs from a hook in the ceiling of a sunroom. It is not moving. Treat the plant and pot as one object, and treat the hanger cords as one cord. Draw the forces acting on the <b>plant and pot</b>.',
  forces:[{label:'FT',dir:'up',len:4},{label:'Fg',dir:'down',len:4}],
  net:{x:0,y:0},
  extra:{FN:o=>`There's no normal force here. The pot isn't resting on any surface — it's hanging. What holds it up is the cord.`},
  explain:`The cord pulls up with tension and gravity pulls down. The plant is at rest, so ${sym('FT')} = ${sym('Fg')}.`,
  scene:()=>`<rect width="640" height="440" fill="#f4efe3"/>
    <rect x="420" y="70" width="170" height="250" fill="#cfe6f5" stroke="#fff" stroke-width="8"/><line x1="505" y1="70" x2="505" y2="320" stroke="#fff" stroke-width="6"/>
    <rect width="640" height="26" fill="#d7d0c2"/><rect y="24" width="640" height="4" fill="#b8ae9b"/>

/* =========================================================
   GRADING  (pure function — easy to reuse for Levels 2–3)
   ========================================================= */
/* Each problem returns three hints: [vague, guiding, direct].
   The student sees a more direct one each time they repeat the same mistake. */
const VAGUE_MISSING_T2 = {
  Fg:   o => `Something is missing. Remember the force that acts on every object near Earth, even when nothing is touching it.`,
  FN:   o => `Something is missing. Make a list of everything that is touching ${o}. Each thing touching it can exert a force. Have you drawn one for each?`,
  FT:   o => `Something is missing. Make a list of everything that is touching or attached to ${o}. Each one can exert a force. Have you drawn one for each?`,
  Ff:   o => `Something is missing. ${cap(o)} is moving across a surface. What happens when two surfaces slide against each other?`,
  Fsp:  o => `Something is missing. Make a list of everything that is attached to ${o}. Each one can exert a force. Have you drawn one for each?`,
  Fapp: o => `Something is missing. Make a list of everything that is touching ${o}. Each thing touching it can exert a force.`,
  Fair: o => `Something is missing. ${cap(o)} is moving through the air. Does the air affect it?`,
  Fb:   o => `Something is missing. ${cap(o)} is surrounded by a fluid (a liquid or a gas). Does that fluid push on it?`
};
function grade1(sc, arrows){
  const o = sc.obj;
  const pick = (table, key, fallback) => (table && table[key]) ? table[key](o) : fallback(o);
  const same = m => [m, m, m];
  const unl = arrows.filter(a => !a.label);
  if (!arrows.length) return {ok:false, key:'empty', hints:same(`Draw at least one force arrow first. Drag outward from the black dot.`), ids:[]};
  if (unl.length) return {ok:false, key:'unlabeled', hints:same(`Every arrow needs a label. Click the gray arrow${unl.length>1?'s':''} and choose which force ${unl.length>1?'they represent':'it represents'}.`), ids:unl.map(a=>a.id)};

  const groups = {};
  arrows.forEach(a => (groups[a.label] = groups[a.label] || []).push(a));
  for (const k in groups) if (groups[k].length > 1)
    return {ok:false, key:'dup-'+k, hints:same(`You have ${groups[k].length} arrows labeled ${sym(k)}. Each force on the object is drawn only once — combine them into a single arrow.`), ids:groups[k].map(a=>a.id)};

  const matched = {}, used = new Set();
  for (const f of sc.forces){
    const labs = [f.label, ...(f.alt||[])];
    const a = arrows.find(a => labs.includes(a.label) && !used.has(a.id));
    if (a){ matched[f.label] = a; used.add(a.id); }
  }
  const extras = arrows.filter(a => !used.has(a.id));
  if (extras.length){
    const a = extras[0];
    return {ok:false, key:'extra-'+a.label, ids:[a.id], hints:[
      `Your diagram includes a force that isn't actually acting on ${o}.`,
      `The highlighted arrow shows a force that isn't acting on ${o}. For every force, you should be able to name the object that exerts it. What would be exerting this one?`,
      pick(sc.extra, a.label, GENERIC.extra[a.label])
    ]};
  }
  const missing = sc.forces.filter(f => !matched[f.label]);
  if (missing.length){
    const f = missing[0];
    const more = missing.length > 1 ? ` <span style="color:#5b6475">(You're missing ${missing.length} forces.)</span>` : '';
    return {ok:false, key:'missing-'+f.label, ids:[], hints:[
      (missing.length > 1 ? `Your diagram is missing ${missing.length} forces.` : `Your diagram is missing a force.`) + ` Think about everything that could be pushing or pulling on ${o}.`,
      VAGUE_MISSING_T2[f.label](o) + more,
      pick(sc.missing, f.label, GENERIC.missing[f.label]) + more
    ]};
  }
  for (const f of sc.forces){
    const a = matched[f.label];
    if (a.dir !== f.dir) return {ok:false, key:'dir-'+f.label, ids:[a.id], hints:[
      `You have the right forces, but one of them points the wrong way.`,
      `The highlighted arrow points the wrong way. Think about what is exerting that force and which way it pushes or pulls.`,
      pick(sc.dirHint, f.label, GENERIC.dir[f.label])
    ]};
  }
  let sx = 0, sy = 0;
  arrows.forEach(a => { const d = DIRS[a.dir]; sx += d[0]*a.len; sy += -d[1]*a.len; });
  const sgn = v => v > 0 ? 1 : v < 0 ? -1 : 0;
  const lenT1 = `Your forces and directions are right, but the arrow lengths aren't. Read the situation again: is ${o} speeding up, slowing down, or keeping a steady velocity?`;
  if (sgn(sy) !== sc.net.y){
    const ids = arrows.filter(a => a.dir==='up'||a.dir==='down').map(a=>a.id);
    const t2 = sc.net.y === 0
      ? `Look at the highlighted vertical arrows. If an object's velocity isn't changing, the net force on it is zero. How should the up and down arrows compare?`
      : `Look at the highlighted vertical arrows. ${cap(o)}'s velocity is changing, so the net force isn't zero. Which way is ${o} accelerating, and which way should the net force point?`;
    const t3 = (sc.netHint && sc.netHint.y) ? sc.netHint.y(o)
      : `${cap(o)} is ${sc.still || sc.stillY || 'not accelerating up or down'}, so the vertical forces must balance: the total length of the upward arrows must equal the total length of the downward arrows. Use the white dots to compare.`;
    return {ok:false, key:'net-y', ids, hints:[lenT1, t2, t3]};
  }
  if (sgn(sx) !== sc.net.x){
    const ids = arrows.filter(a => a.dir==='left'||a.dir==='right').map(a=>a.id);
    const t3 = (sc.netHint && sc.netHint.x) ? sc.netHint.x(o)
      : `${cap(o)} is not speeding up or slowing down sideways, so the left and right forces must balance: make their total lengths equal.`;
    return {ok:false, key:'net-x', ids, hints:[lenT1, `Look at the highlighted horizontal arrows. Is ${o} speeding up or slowing down sideways? What does that tell you about the net horizontal force?`, t3]};
  }
  for (const r of (sc.rel||[])){
    const la = matched[r.a].len, lb = matched[r.b].len;
    const ok = r.op==='<' ? la < lb : r.op==='>' ? la > lb : la === lb;
    if (!ok) return {ok:false, key:'rel-'+r.a+r.b, ids:[matched[r.a].id, matched[r.b].id], hints:[
      `Almost! The forces balance the way they should, but compare the sizes of your forces. Is one of them drawn too big compared with another?`,
      `Compare the two highlighted arrows. Think about the surfaces involved. Which of these forces should be bigger in this situation?`,
      r.hint
    ]};
  }
  if (sc.scale){
    const off = sc.forces.filter(f => matched[f.label].len !== f.len);
    if (off.length){
      const f = off[0], a = matched[f.label], S = fmt(sc.scale), val = fmt(f.len*sc.scale);
      const t2 = f.given
        ? `The highlighted arrow isn't drawn to scale. Find this force's value in the problem and divide by the scale (${S} N per dot) to get how many dots long it should be.`
        : `The highlighted arrow isn't drawn to scale. The problem doesn't give this force directly — use the other forces and whether ${o} is accelerating to work out its size, then convert to dots (${S} N per dot).`;
      const t3 = (f.given ? `The problem gives ${sym(f.label)} = ${val} N.` : f.why) +
        ` At ${S} N per dot, ${sym(f.label)} should be ${f.len} dot${f.len>1?'s':''} long. Yours is ${a.len}.`;
      return {ok:false, key:'scale-'+f.label, ids:[a.id], hints:[
        `Your forces, directions, and balance are right, but at least one arrow isn't drawn to scale. Check each length against the scale: 1 dot = ${S} N.`,
        t2, t3
      ]};
    }
  }
  return {ok:true};
}

/* Ramp rising to the right at angle theta, object centered at c, drawn rotated. */
function incline({theta, c=[320,220], h=56, obj, bg, xTop=600, after='', ramp='#c8b48f', ground='#8c7b5e'}){
  const t = rad(theta), s = Math.sin(t), co = Math.cos(t), G = 412;
  const bx = c[0] + s*h/2, by = c[1] + co*h/2;          // contact point under the object
  const x0 = bx + ((by-G)/s)*co;                        // where ramp meets the ground
  const yTop = by - ((xTop-bx)/co)*s;
  const px = Math.max(x0, 70), py = by - ((px-bx)/co)*s; // where the angle is marked
  const R = 62;
  return `${bg || sky()}
    <polygon points="${x0},${G} ${xTop},${yTop} ${xTop},${G}" fill="${ramp}" stroke="#7a6545" stroke-width="2"/>
    <rect y="${G}" width="640" height="${440-G}" fill="${ground}"/>
    <line x1="${px}" y1="${py}" x2="${px+R+30}" y2="${py}" stroke="#5c4a2e" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M${px+R} ${py} A${R} ${R} 0 0 0 ${px+R*co} ${py-R*s}" fill="none" stroke="#5c4a2e" stroke-width="1.5"/>
    <text x="${px+(R+14)*Math.cos(t/2)}" y="${py-(R+14)*Math.sin(t/2)+5}" font-size="15" font-weight="700" fill="#3d2f1a">${theta}°</text>
    <g transform="translate(${c[0]} ${c[1]}) rotate(${-theta})">${obj}</g>${after}`;
}

const TRIG = {12:[.21,.98],22:[.37,.93],28:[.47,.88],32:[.53,.85],33:[.54,.84],35:[.57,.82],40:[.64,.77],42:[.67,.74],50:[.77,.64],5:[.09,1.00],10:[.17,.98],15:[.26,.97],17:[.29,.96],20:[.34,.94],25:[.42,.91],30:[.50,.87],37:[.60,.80],45:[.71,.71],53:[.80,.60],60:[.87,.50]};
const sinT = a => TRIG[a][0], cosT = a => TRIG[a][1];
trigNote = (...angles) => angles.map(a => `sin ${a}° = ${TRIG[a][0].toFixed(2)}, cos ${a}° = ${TRIG[a][1].toFixed(2)}`).join('; ');
const r3 = v => Number(Number(v).toPrecision(3));
const N = v => fmt(r3(v)) + ' N';
function autoScale(maxVal, maxDots){
  const c = []; for (let k=-3;k<=5;k++) for (const m of [1,1.5,2,2.5,3,4,5,6,8]) c.push(m*Math.pow(10,k));
  return Number(c.find(s => maxVal/s <= maxDots + 1e-9).toPrecision(3));
}

function restScene(setting, o, c){
  const y0 = c[1] + o.h/2; let s = '';
  if (setting === 'counter') s = wallBg('#f1ece2') + `<g fill="#dfe7ee">${[...Array(10)].map((_,i)=>R(i*64+2,60,60,30,'#dfe7ee')).join('')}</g>` + R(40,y0,560,404-y0,'#adb5bd') + R(30,y0-2,580,12,'#495057','rx="3"') + R(60,y0+30,120,360-y0,'#ced4da') + R(200,y0+30,120,360-y0,'#ced4da') + R(0,404,640,36,'#c4b190');
  else if (setting === 'stand') s = room() + R(c[0]-95,y0,190,400-y0,'#6e4630','rx="3"') + R(c[0]-85,y0+16,80,380-y0,'#7a4e33') + R(c[0]+5,y0+16,80,380-y0,'#7a4e33');
  else if (setting === 'floor') s = wallBg() + R(60,40,130,95,'#d9e8f2',STK('#b9a68a',6)) + R(0,y0,640,440-y0,'#c4a27a') + `<g stroke="#a98863" stroke-width="2">${[...Array(6)].map((_,i)=>`<line x1="0" y1="${y0+14+i*28}" x2="640" y2="${y0+14+i*28}"/>`).join('')}</g>`;
  else if (setting === 'gym') s = wallBg('#dbe4ee') + `<g fill="#c5d3e3">${[...Array(10)].map((_,i)=>R(i*66,30,50,80,'#c5d3e3')).join('')}</g>` + R(0,y0,640,440-y0,'#e5b97a') + `<line x1="0" y1="${y0+60}" x2="640" y2="${y0+60}" stroke="#c92a2a" stroke-width="4"/>`;
  else if (setting === 'stage') s = R(0,0,640,440,'#2b1d1d') + `<g fill="#8b1e1e">${[...Array(8)].map((_,i)=>Pp(`M${i*80} 0 h70 q-10 ${y0/2} 0 ${y0} h-70 q10 ${-y0/2} 0 ${-y0}z`,'#8b1e1e')).join('')}</g>` + R(0,y0,640,440-y0,'#5c3d2e') + R(0,y0,640,6,'#3b2a20');
  return s + `<g transform="translate(${c[0]} ${c[1]})">${o.svg}</g>`;
}
function hangScene(top, o, c, extra=''){
  const ty = c[1] - o.h/2; let s = '', ay = 26;
  if (top === 'ceiling') s = wallBg('#f4efe3') + R(0,0,640,26,'#d7d0c2') + R(0,24,640,4,'#b8ae9b');
  else if (top === 'beam') s = wallBg('#e9ecef') + R(0,0,640,30,'#495057') + R(0,30,640,6,'#343a40') + R(0,404,640,36,'#868e96');
  else if (top === 'crane') { s = sky() + R(0,404,640,36,'#868e96') + Pp('M40 30 L640 30 L640 46 L40 46Z','#f2c230') + R(560,46,40,358,'#f2c230'); ay = 46; }
  else if (top === 'branch') { s = sky() + R(0,404,640,36,'#6fae4c') + Pp('M0 20 Q200 50 420 30 Q520 22 640 40 L640 60 Q520 44 420 52 Q200 72 0 44Z','#6e4630') + Cc(80,20,50,'#4f9a42') + Cc(520,26,60,'#4f9a42'); ay = 42; }
  else if (top === 'helicopter') { s = sky('#8ec5ea','#e6f4fc') + R(0,410,640,30,'#7da35a') + Pp(`M${c[0]-80} 20 h140 q30 0 30 22 h-200 q0 -22 30 -22z`,'#c92a2a') + R(c[0]-130,4,260,5,'#343a40') + R(c[0]+60,30,120,8,'#c92a2a'); ay = 42; }
  else if (top === 'cliff') { s = sky() + Pp('M440 0 H640 V440 H470 L500 300 L452 160 L480 60Z','#8d7b68') + R(0,0,640,10,'#6e5f50'); ay = 0; }
  else if (top === 'well') { s = sky() + R(0,300,640,140,'#7da35a') + R(c[0]-80,0,10,300,'#6e4630') + R(c[0]+70,0,10,300,'#6e4630') + R(c[0]-90,16,180,14,'#8a5a3b') + Cc(c[0],23,12,'#495057'); ay = 30; }
  else if (top === 'shaft') { s = R(0,0,640,440,'#5c636e') + R(180,0,280,440,'#4a5059'); ay = 0; }
  return s + `<line x1="${c[0]}" y1="${ay}" x2="${c[0]}" y2="${ty}" stroke="#3b3b3b" stroke-width="3"/><g transform="translate(${c[0]} ${c[1]})">${o.svg}</g>` + extra;
}
function fallScene(o, c, note){
  return sky('#7fbbe6','#dff0fb') + cloud(100,90) + cloud(520,340,1.2) + cloud(140,380,.8) + cloud(470,70,.7) + `<g transform="translate(${c[0]} ${c[1]})">${o.svg}</g>` + motion('down',540,120,note);
}
function slideScene(surface, o, c, dir, note){
  const y0 = c[1] + o.h/2; let s = '';
  if (surface === 'warehouse') s = wallBg('#dee2e6') + `<g fill="#adb5bd">${[...Array(6)].map((_,i)=>R(i*110+10,60,90,110,'#ced4da')).join('')}</g>` + R(0,y0,640,440-y0,'#adb5bd') + `<g stroke="#f2c230" stroke-width="4">${[...Array(8)].map((_,i)=>`<line x1="${i*90}" y1="${y0+40}" x2="${i*90+50}" y2="${y0+40}"/>`).join('')}</g>`;
  else if (surface === 'infield') s = sky() + R(0,y0-60,640,60,'#5c9e47') + R(0,y0,640,440-y0,'#c8865a') + R(70,y0-10,44,12,'#fff','rx="2"');
  else if (surface === 'counter') s = wallBg('#fff4e6') + R(0,y0,640,30,'#e03131') + R(0,y0+30,640,440-y0,'#adb5bd') + `<g fill="#495057">${[100,260,420,580].map(x=>R(x-14,y0+30,28,90,'#495057')).join('')}</g>`;
  else if (surface === 'shuffle') s = wallBg('#2b1d14') + R(0,y0,640,40,'#e9c46a') + R(0,y0+40,640,440-y0,'#6e4630') + `<line x1="560" y1="${y0}" x2="560" y2="${y0+40}" stroke="#c92a2a" stroke-width="4"/>`;
  else if (surface === 'labtable') s = wallBg('#eef1f5') + R(0,y0,640,18,'#343a40') + R(40,y0+18,14,440,'#495057') + R(586,y0+18,14,440,'#495057');
  return s + `<g transform="translate(${c[0]} ${c[1]})">${o.svg}</g>` + motion(dir, dir==='right'?420:200, 110, note);
}
function floatScene(o, c, setting){
  const wl = c[1] + 4;
  let s = setting === 'tub' ? wallBg('#e3fafc') + `<g fill="#c5f6fa">${[...Array(12)].map((_,i)=>R(i*54,0,50,50,'#c5f6fa')).join('')}</g>` + R(30,120,580,320,'#fff',STK('#ced4da',4))
        : sky('#a9d3ee','#eaf5fb') + Pp('M0 200 Q160 160 320 196 T640 186 V240 H0Z','#6c9a5a');
  return s + `<g transform="translate(${c[0]} ${c[1]})">${o.svg}</g>` + R(0,wl,640,440-wl,'#3d7fb0','opacity=".82"') + `<path d="M60 ${wl+40} h60 M420 ${wl+70} h80" stroke="#6aa6cf" stroke-width="3" stroke-linecap="round"/>`;
}
function springScene(o, c, mount){
  const top = mount === 'hand' ? 70 : 26, ty = c[1] - o.h/2;
  let s = mount === 'lab' ? wallBg('#eef1f5') + R(120,26,14,380,'#495057') + R(120,20,220,10,'#495057') + R(90,400,120,10,'#343a40')
        : mount === 'hand' ? wallBg('#e7f5ff') + R(0,404,640,36,'#adb5bd') + person({x:c[0]+110, foot:404, hand:[c[0],top-6], color:'#e8590c', facing:-1, lean:-6}) + R(c[0]-12,top-14,24,12,'#212529','rx="3"')
        : wallBg('#fff9db') + R(0,0,640,26,'#adb5bd') + R(c[0]-24,26,48,40,'#f8f9fa',STK('#868e96'));
  const sy = mount === 'hand' ? top : mount === 'lab' ? 30 : 66;
  const n = 10, seg = (ty - 8 - sy)/n;
  const zig = [...Array(n)].map((_,i)=>`L${c[0]+(i%2?-10:10)} ${sy+seg*(i+0.5)}`).join(' ');
  return s + `<path d="M${c[0]} ${sy} ${zig} L${c[0]} ${ty-8} L${c[0]} ${ty}" fill="none" stroke="#495057" stroke-width="2.5"/><g transform="translate(${c[0]} ${c[1]})">${o.svg}</g>`;
}

/* ---------- Level 2 scene builders ---------- */
function flatScene(ground, gy){
  if (ground === 'snow') return sky('#b5d5ec','#eef6fb') + R(0,gy,640,440-gy,'#fbfdff') + `<path d="M0 ${gy} H640" stroke="#dce7f0" stroke-width="3"/>`;
  if (ground === 'sand') return sky() + R(0,gy-40,640,40,'#3d7fb0') + R(0,gy,640,440-gy,'#f1d9a7');
  if (ground === 'grass') return sky() + R(0,gy,640,440-gy,'#6aaa4a');
  if (ground === 'carpet') return wallBg('#e9e2d6') + R(0,gy,640,440-gy,'#8d99ae');
  if (ground === 'wood') return wallBg('#e9dcc3') + R(0,gy,640,440-gy,'#d9a066') + `<g stroke="#c08552" stroke-width="2">${[...Array(10)].map((_,i)=>`<line x1="0" y1="${gy+10+i*18}" x2="640" y2="${gy+10+i*18}"/>`).join('')}</g>`;
  if (ground === 'sidewalk') return sky() + R(0,gy,640,440-gy,'#ced4da');
  if (ground === 'lab') return wallBg('#eef1f5') + R(0,gy,640,440-gy,'#343a40');
  return sky() + R(0,gy,640,440-gy,'#ced4da');
}
function pullScene(o, c, ang, ground, note, col='#7048e8', L=150){
  const gy = c[1] + o.h/2, h = at(c, ang, L);
  return flatScene(ground, gy) + `<g transform="translate(${c[0]} ${c[1]})">${o.svg}</g>` +
    `<line x1="${c[0]}" y1="${c[1]}" x2="${h[0]}" y2="${h[1]}" stroke="#8d6e3f" stroke-width="3"/>` +
    person({x:h[0]+40, foot:gy, hand:h, color:col, facing:1, lean:12}) + motion('right',60,90,note);
}
function pushScene(o, c, below, ground, note, col='#f08c00', L=165){
  const gy = c[1] + o.h/2, h = at(c, 180 - below, L);
  return flatScene(ground, gy) + `<g transform="translate(${c[0]} ${c[1]})">${o.svg}</g>` +
    `<line x1="${c[0]}" y1="${c[1]}" x2="${h[0]}" y2="${h[1]}" stroke="#343a40" stroke-width="5"/>` +
    person({x:h[0]-46, foot:gy, hand:h, color:col, facing:1, lean:22}) + motion('right',440,90,note);
}
function twoCableScene(o, c, a1, a2, bg){
  const p1 = at(c, 180-a1, 250), p2 = at(c, a2, 250), top = c[1] - o.h/2;
  return (bg || sky()) + `<rect x="${p1[0]-8}" y="${p1[1]}" width="16" height="${440-p1[1]}" fill="#495057"/><rect x="${p2[0]-8}" y="${p2[1]}" width="16" height="${440-p2[1]}" fill="#495057"/>
    <line x1="${c[0]}" y1="${top}" x2="${p1[0]}" y2="${p1[1]}" stroke="#212529" stroke-width="3"/><line x1="${c[0]}" y1="${top}" x2="${p2[0]}" y2="${p2[1]}" stroke="#212529" stroke-width="3"/>
    ${label(c[0]+0.78*(p1[0]-c[0])+6,top+0.78*(p1[1]-top)-10,'cable 1','start')}${label(c[0]+0.78*(p2[0]-c[0])-6,top+0.78*(p2[1]-top)-10,'cable 2','end')}
    <g transform="translate(${c[0]} ${c[1]})">${o.svg}</g>`;
}
function heldScene(o, c, phi, kind){
  const top = at(c, 90+phi, 230);
  const s = kind === 'swing' ? sky() + R(0,404,640,36,'#6aaa4a') + R(top[0]-120,top[1]-8,280,12,'#c92a2a') + R(top[0]-120,top[1],10,404-top[1],'#c92a2a') + R(top[0]+150,top[1],10,404-top[1],'#c92a2a')
           : wallBg('#e9ecef') + R(0,0,640,top[1]+4,'#495057') + R(0,404,640,36,'#868e96');
  return s + `<line x1="${top[0]}" y1="${top[1]}" x2="${c[0]}" y2="${c[1]}" stroke="#495057" stroke-width="4" stroke-dasharray="${kind==='swing'?'6 3':'0'}"/>` +
    `<g transform="translate(${c[0]} ${c[1]})">${o.svg}</g>` + (kind === 'swing'
      ? person({x:c[0]+110, foot:404, hand:[c[0]+o.w/2+4, c[1]], color:'#1098ad', facing:-1, lean:-14})
      : person({x:c[0]-110, foot:404, hand:[c[0]-o.w/2-4, c[1]], color:'#1098ad', facing:1, lean:14}));
}

/* ---------- Level 3 scene builders ---------- */
function atwoodScene(Lc, Rc, Lo, Ro, Lname, Rname, Lnote, Rnote, Ldir, Rdir){
  return `<rect width="640" height="440" fill="#eef1f5"/><rect x="0" y="0" width="640" height="22" fill="#adb5bd"/><rect x="314" y="22" width="12" height="28" fill="#495057"/>
    <circle cx="320" cy="60" r="60" fill="#dee2e6" stroke="#495057" stroke-width="5"/><circle cx="320" cy="60" r="8" fill="#495057"/>
    <line x1="260" y1="60" x2="${Lc[0]}" y2="${Lc[1]-Lo.h/2}" stroke="#333" stroke-width="2"/><line x1="380" y1="60" x2="${Rc[0]}" y2="${Rc[1]-Ro.h/2}" stroke="#333" stroke-width="2"/>
    <g transform="translate(${Lc[0]} ${Lc[1]})">${Lo.svg}</g><g transform="translate(${Rc[0]} ${Rc[1]})">${Ro.svg}</g>
    ${label(Lc[0]-Lo.w/2-8, Lc[1]+5, Lname, 'end')}${label(Rc[0]+Ro.w/2+8, Rc[1]+5, Rname, 'start')}
    ${motion(Ldir,150,Ldir==='down'?120:300,Lnote)}${motion(Rdir,500,Rdir==='up'?300:120,Rnote)}`;
}
function tableHangScene(topO, topC, hangO, hangC, surf, notes){
  const ty = topC[1] + topO.h/2;
  const top = surf === 'desk' ? wallBg('#efe7da') + R(30,ty,460,16,'#8a5a3b') + R(50,ty+16,14,440,'#6e4630') + R(452,ty+16,14,440,'#6e4630')
            : surf === 'dock' ? sky() + R(0,ty+40,640,400,'#3d7fb0') + R(0,ty,490,40,'#a07a52') + `<g stroke="#86643f" stroke-width="2">${[...Array(12)].map((_,i)=>`<line x1="${i*40}" y1="${ty}" x2="${i*40}" y2="${ty+40}"/>`).join('')}</g>`
            : surf === 'deck' ? sky('#b5d5ec','#eef6fb') + R(0,ty,490,30,'#fbfdff') + R(0,ty+30,490,400,'#8a5a3b') + R(490,ty+30,150,400,'#fbfdff')
            : wallBg('#eef1f5') + R(30,ty,460,18,'#343a40') + R(50,ty+18,14,440,'#495057') + R(452,ty+18,14,440,'#495057');
  const py = ty - 20;
  return top + `<g transform="translate(${topC[0]} ${topC[1]})">${topO.svg}</g>
    <line x1="${topC[0]+topO.w/2}" y1="${topC[1]}" x2="482" y2="${py-12}" stroke="#333" stroke-width="2"/>
    <path d="M470 ${ty} L482 ${py}" stroke="#495057" stroke-width="4"/><circle cx="482" cy="${py}" r="12" fill="#dee2e6" stroke="#495057" stroke-width="3"/>
    <line x1="494" y1="${py}" x2="494" y2="${hangC[1]-hangO.h/2}" stroke="#333" stroke-width="2"/>
    <g transform="translate(${hangC[0]} ${hangC[1]})">${hangO.svg}</g>
    ${motion('right',120,110,notes[0])}${motion('down',560,330,notes[1]).replace(/x="574"/g,'x="574"')}`;
}
function pushPairScene(oA, cA, oB, cB, nameA, nameB, floor, pusher, gy){
  const gA = [cA[0], gy - oA.h/2], gB = [cB[0], gy - oB.h/2];
  const bg = floor === 'classroom' ? wallBg('#e9e2d6') + R(0,gy,640,440-gy,'#ced4da')
           : floor === 'lab' ? wallBg('#eef1f5') + R(0,gy,640,440-gy,'#343a40')
           : floor === 'warehouse' ? wallBg('#dee2e6') + R(0,gy,640,440-gy,'#adb5bd')
           : floor === 'store' ? wallBg('#fff4e6') + R(0,gy,640,440-gy,'#e9ecef')
           : wallBg() + R(0,gy,640,440-gy,'#b08968');
  const hand = [cA[0]-oA.w/2, gA[1]];
  const who = pusher === 'forklift' ? `<g>${R(hand[0]-120,gy-70,90,60,'#f2c230','rx="6"')}${R(hand[0]-30,gy-110,8,110,'#495057')}${R(hand[0]-30,cA[1]-6,30,8,'#495057')}${Cc(hand[0]-100,gy-8,12,'#222')}${Cc(hand[0]-50,gy-8,12,'#222')}</g>`
            : pusher === 'hand' ? `<path d="M${hand[0]-80} ${hand[1]} H${hand[0]-6}" stroke="#e0a77c" stroke-width="16" stroke-linecap="round"/>`
            : person({x:hand[0]-66, foot:gy, hand, color:'#2f9e44', facing:1, lean:26});
  return bg + who + `<g transform="translate(${gA[0]} ${gA[1]})">${oA.svg}</g><g transform="translate(${gB[0]} ${gB[1]})">${oB.svg}</g>` +
    label(gA[0]-oA.w/2+4, gy+24, nameA, 'start') + label(gB[0]+oB.w/2-4, gy+24, nameB, 'end') + motion('right',470,100,'speeding up');
}
function towScene(oB, cB, oF, cF, nameB, nameF, ground, puller, note){
  const gy = cB[1] + Math.max(oB.h, oF.h)/2;
  const bg = flatScene(ground, gy);
  const end = [560, cF[1]];
  const who = puller === 'probe' ? R(548,cF[1]-14,60,28,'#ffd43b','rx="5"') + Pp(`M608 ${cF[1]} H640`,'none',STK('#e0a77c',14))
            : person({x:600, foot:gy, hand:end, color:'#862e9c', facing:-1, lean:-30});
  return bg + `<line x1="${cB[0]+oB.w/2}" y1="${cB[1]}" x2="${cF[0]-oF.w/2}" y2="${cF[1]}" stroke="#f59f00" stroke-width="3"/>
    <line x1="${cF[0]+oF.w/2}" y1="${cF[1]}" x2="${end[0]}" y2="${end[1]}" stroke="#f59f00" stroke-width="3"/>` + who +
    `<g transform="translate(${cB[0]} ${cB[1]})">${oB.svg}</g><g transform="translate(${cF[0]} ${cF[1]})">${oF.svg}</g>` +
    label((cB[0]+oB.w/2+cF[0]-oF.w/2)/2, cB[1]+38, 'rope 2') + label((cF[0]+oF.w/2+end[0])/2, cF[1]+38, 'rope 1') +
    label(cB[0], gy+28, nameB) + label(cF[0], gy+28, nameF) + motion('right',60,90,note);
}
function stackScene(oT, cT, oB, cB, nameT, nameB, surface){
  const y0 = cB[1] + oB.h/2;
  const s = surface === 'desk' ? room() + R(90,y0,460,16,'#8a5a3b','rx="3"') + R(110,y0+16,16,404-y0-16,'#6e4630') + R(514,y0+16,16,404-y0-16,'#6e4630')
          : surface === 'counter' ? wallBg('#f1ece2') + R(40,y0,560,404-y0,'#adb5bd') + R(30,y0-2,580,12,'#495057','rx="3"') + R(0,404,640,36,'#c4b190')
          : surface === 'chair' ? room() + R(cB[0]-100,y0,200,14,'#8a5a3b') + R(cB[0]-96,y0+14,12,404-y0-14,'#6e4630') + R(cB[0]+84,y0+14,12,404-y0-14,'#6e4630') + R(cB[0]+84,y0-150,12,150,'#6e4630')
          : wallBg() + R(0,y0,640,440-y0,'#c4a27a');
  return s + `<g transform="translate(${cB[0]} ${cB[1]})">${oB.svg}</g><g transform="translate(${cT[0]} ${cT[1]})">${oT.svg}</g>` +
    label(cT[0]-oT.w/2-10, cT[1]+5, nameT, 'end') + label(cB[0]+oB.w/2+10, cB[1]+5, nameB, 'start');
}
function inclinePulleyScene(theta, crO, cC, hgO, motionUp){
  const t = rad(theta), s = Math.sin(t), co = Math.cos(t);
  const bx = cC[0] + s*crO.h/2, by = cC[1] + co*crO.h/2;
  const yTop = by - ((470-bx)/co)*s, pc = [486, yTop-16];
  const face = [cC[0] + co*crO.w/2, cC[1] - s*crO.w/2];
  const hc = [500, Math.min(yTop + 150, 320)];
  return { hc, svg: incline({theta, c:cC, h:crO.h, xTop:470, obj:crO.svg, after:`
    <path d="M470 ${yTop} L${pc[0]} ${pc[1]}" stroke="#495057" stroke-width="4"/><circle cx="${pc[0]}" cy="${pc[1]}" r="14" fill="#dee2e6" stroke="#495057" stroke-width="3"/>
    <line x1="${face[0]}" y1="${face[1]}" x2="${pc[0]-14*s}" y2="${pc[1]-14*co}" stroke="#333" stroke-width="2"/>
    <line x1="500" y1="${pc[1]}" x2="500" y2="${hc[1]-hgO.h/2}" stroke="#333" stroke-width="2"/>
    <g transform="translate(${hc[0]} ${hc[1]})">${hgO.svg}</g>
    ${motion(motionUp ? 'down' : 'up', 560, motionUp ? 300 : 410, 'speeding up')}`}) };
}
function liftScene(itemO, cI, carO, cC, note, dir){
  return R(0,0,640,440,'#5c636e') + R(240,0,300,440,'#4a5059') + `<line x1="${cC[0]}" y1="0" x2="${cC[0]}" y2="${cC[1]-carO.h/2}" stroke="#212529" stroke-width="3"/>` +
    `<g transform="translate(${cC[0]} ${cC[1]})">${carO.svg}</g><g transform="translate(${cI[0]} ${cI[1]})">${itemO.svg}</g>` + motion(dir, 540, dir==='up'?300:130, note, '#f1f3f5');
}

/* =========================================================
   GENERATED SITUATIONS — each family below turns a table of
   real-world contexts into complete situations. Every answer
   and hint is computed from the given values.
   ========================================================= */
const short = n => n.replace(/^the /,'');
const wt = n => / and /.test(n) ? 'weigh' : 'weighs';   // "the child and seat weigh"
const accelText = (dir, change) => {
  const opp = dir === 'up' ? 'down' : 'up';
  return change === 'slowing down'
    ? o => `Careful — ${o} is moving ${dir}, but it's <em>slowing down</em>. Slowing down while moving ${dir} means the acceleration points <em>${opp}</em>, so the net force must point ${opp}. Which arrow should be longer?`
    : o => `${cap(o)} is <em>speeding up</em> while moving ${dir}, so its acceleration — and the net force — points ${dir}. Compare your up and down arrows: which one should be longer?`;
};
const accelSign = (dir, change) => change === 'constant speed' || change === 'at rest' ? 0 : ((dir === 'up') === (change === 'speeding up') ? 1 : -1);
function mk1(o){
  L1.push({...o, forces: o.forces.map(f => ({label:f.label, alt:f.alt, dir:f.dir, len:Math.round(f.n), why:f.why, given:!f.why}))});
}

/* =========================================================
   RESULTS RECORDING — single hook for future score saving
   Every gameplay event goes through Results.record(). Right now events are
   only kept in memory for this session. To save scores later (gradebook,
   teacher dashboard, shared database), add the save call inside record()
   — nothing else in the game needs to change.
   Event types: 'start', 'submit', 'skip', 'level-complete'
   ========================================================= */
const Results = {
  student: null,
  session: Date.now().toString(36),
  events: [],
  record(type, data){
    const ev = {type, level: state.level, time: new Date().toISOString(), session: this.session, student: this.student, ...data};
    this.events.push(ev);
    // >>> FUTURE: send `ev` to wherever scores are stored <<<
  },
  summary(level){
    const ev = this.events.filter(e => level == null || e.level === level);
    const subs = ev.filter(e => e.type === 'submit'), solved = subs.filter(e => e.correct);
    return {student:this.student, level,
      firstTryCorrect: solved.filter(e => e.attempt === 1).length,
      solvedAfterRetries: solved.filter(e => e.attempt > 1).length,
      skipped: ev.filter(e => e.type === 'skip').length,
      totalSubmits: subs.length,
      levelComplete: ev.some(e => e.type === 'level-complete')};
  }
};
window.Results = Results;

/* =========================================================
   GEOMETRY + TEXT HELPERS
   ========================================================= */
const norm = a => ((a % 360) + 360) % 360;
const angDiff = (a,b) => { const d = Math.abs(norm(a) - norm(b)); return Math.min(d, 360-d); };
const vec = a => [Math.cos(rad(a)), -Math.sin(rad(a))];          // screen direction
const dirOf = a => ({0:'right',90:'up',180:'left',270:'down'})[norm(Math.round(a))];
function describe(a){
  a = norm(Math.round(a));
  if (a === 0) return 'straight to the right'; if (a === 90) return 'straight up';
  if (a === 180) return 'straight to the left'; if (a === 270) return 'straight down';
  if (a < 90)  return `${a}° above horizontal, up and to the right`;
  if (a < 180) return `${180-a}° above horizontal, up and to the left`;
  if (a < 270) return `${a-180}° below horizontal, down and to the left`;
  return `${360-a}° below horizontal, down and to the right`;
}
function shortAng(a){
  a = norm(Math.round(a));
  if (a === 0 || a === 180) return 'horizontal'; if (a === 90 || a === 270) return 'vertical';
  if (a < 90) return `${a}° above horiz.`; if (a < 180) return `${180-a}° above horiz.`;
  if (a < 270) return `${a-180}° below horiz.`; return `${360-a}° below horiz.`;
}
const fmtLen = l => (Math.round(l*2)/2).toString();
const getG = (table, label) => table[label] || table[label.replace(/\d$/,'')];

/* =========================================================
   GRADER FOR LEVELS 2 AND 3 (vector forces, one or more objects)
   Returns {ok} or {ok:false, key, ids, hints:[vague, guiding, direct]}
   ========================================================= */
const ANG_TOL = 5, LEN_TOL = 0.5, VAL_TOL = 0.02;   // typed magnitudes must be within 2%
const typed = () => LV().mode === 'vector';
const valOk = (v, want, s) => Math.abs(v - want) <= Math.max(VAL_TOL*want, 0.002*Math.max(...s.objects.flatMap(o => o.forces.map(f => f.val || 0))));
function gradeV(sc, arrows){
  const objs = sc.objects, multi = sc.multi;
  const nm = i => objs[i].name;
  const same = m => [m,m,m];
  const byTxt = by => multi && by ? ` (exerted by the ${by})` : '';
  if (!arrows.length) return {ok:false, key:'empty', ids:[], hints:same(`Draw at least one force arrow first. Drag outward from ${multi ? 'an object\'s' : 'the'} black dot.`)};
  const unl = arrows.filter(a => !a.label || (multi && !a.by));
  if (unl.length) return {ok:false, key:'unlabeled', ids:unl.map(a=>a.id), hints:same(multi
    ? `Every arrow needs a label <em>and</em> a source. Click the gray arrow${unl.length>1?'s':''} and choose the force and what exerts it.`
    : `Every arrow needs a label. Click the gray arrow${unl.length>1?'s':''} and choose which force ${unl.length>1?'they represent':'it represents'}.`)};

  // duplicates on the same object
  const gk = a => `${a.obj}|${a.label}|${multi ? a.by : ''}`, groups = {};
  arrows.forEach(a => (groups[gk(a)] = groups[gk(a)] || []).push(a));
  for (const k in groups) if (groups[k].length > 1){
    const a = groups[k][0];
    let extra = sc.dup && sc.dup[a.label] ? ' ' + sc.dup[a.label] : '';
    const kinds = objs[a.obj].forces.filter(f => f.label === a.label);
    if (multi && kinds.length > 1 && !extra) extra = ` Two <em>different</em> things exert a ${sym(a.label)} on ${nm(a.obj)}. Check what exerts each one.`;
    return {ok:false, key:'dup-'+k, ids:groups[k].map(x=>x.id), hints:same(`On ${nm(a.obj)}, you have ${groups[k].length} arrows labeled ${sym(a.label)}${byTxt(a.by)}. Each force on an object is drawn only once.${extra}`)};
  }

  // match expected forces to arrows
  const exp = []; objs.forEach((o,i) => o.forces.forEach(f => exp.push({...f, obj:i})));
  const used = new Set();
  for (const e of exp){
    const labs = [e.label, ...(e.alt||[])];
    const a = arrows.find(a => !used.has(a.id) && a.obj === e.obj && labs.includes(a.label) && (!multi || a.by === e.by));
    if (a){ e.a = a; used.add(a.id); }
  }
  const extras = arrows.filter(a => !used.has(a.id));
  const missing = exp.filter(e => !e.a);
  if (extras.length){
    const a = extras[0], o = nm(a.obj);
    const wrongBy = multi && missing.find(e => e.obj === a.obj && e.label === a.label);
    if (wrongBy) return {ok:false, key:'by-'+gk(a), ids:[a.id], hints:[
      `Check what is exerting each force on ${o}.`,
      `The highlighted force on ${o} is the right type, but think again about which object exerts it. What is actually touching ${o} (or pulling on it)?`,
      `That ${sym(a.label)} on ${o} is exerted by the ${wrongBy.by}, not the ${a.by}.`]};
    const ex = (sc.extra && sc.extra[a.label]) ? sc.extra[a.label](o) : getG(GENERIC.extra, a.label)(o);
    return {ok:false, key:'extra-'+gk(a), ids:[a.id], hints:[
      multi ? `The diagram for ${o} includes a force that isn't actually acting on it.` : `Your diagram includes a force that isn't actually acting on ${o}.`,
      `The highlighted arrow shows a force that isn't acting on ${o}. For every force, you should be able to name the object that exerts it. What would be exerting this one?`,
      ex]};
  }
  if (missing.length){
    const e = missing[0], o = nm(e.obj);
    const cnt = missing.filter(m => m.obj === e.obj).length;
    const more = missing.length > 1 ? ` <span style="color:#5b6475">(${missing.length} forces are missing in all.)</span>` : '';
    const t3 = (sc.missing && sc.missing[e.label]) ? sc.missing[e.label](o) : getG(GENERIC.missing, e.label)(o);
    return {ok:false, key:'missing-'+e.obj+e.label+(e.by||''), ids:[], hints:[
      (multi ? `The diagram for ${o} is missing ${cnt>1 ? cnt+' forces' : 'a force'}.` : `Your diagram is missing ${cnt>1 ? cnt+' forces' : 'a force'}.`) + ` Think about everything that could be pushing or pulling on ${o}.`,
      getG(VAGUE_MISSING_T2, e.label)(o) + more,
      t3 + (multi ? ` This force is exerted by the ${e.by}.` : '') + more]};
  }
  for (const e of exp){
    if (angDiff(e.a.ang, e.ang) > ANG_TOL){
      const o = nm(e.obj);
      const base = (sc.dirHint && sc.dirHint[e.label]) ? sc.dirHint[e.label](o) : getG(GENERIC.dir, e.label)(o);
      return {ok:false, key:'dir-'+gk(e.a), ids:[e.a.id], hints:[
        multi ? `You have the right forces, but one of the arrows on ${o} points the wrong way.` : `You have the right forces, but one of them points the wrong way.`,
        `The highlighted arrow points the wrong way. Think about what is exerting that force and which way it pushes or pulls.${/FN/.test(e.label)?' (Where is the surface, and which way is "perpendicular" to it?)':''}`,
        `${base} It should point ${describe(e.ang)}.`]};
    }
  }
  // forces that must be equal (same rope, or Newton's third law pairs)
  const sameGroups = {};
  exp.forEach(e => { if (e.same) (sameGroups[e.same] = sameGroups[e.same] || []).push(e); });
  for (const g in sameGroups){
    const L = sameGroups[g].map(e => e.a.val !== undefined ? e.a.val : e.a.len);
    if (Math.max(...L) - Math.min(...L) > 1e-9){
      const h = sc.sameHints[g];
      const t3 = sameGroups[g].some(e => e.a.val !== undefined) ? h.t3.replace(/ \([\d.]+ dots?[^)]*\)/g, '') : h.t3;   // no dot counts when sizes are typed
      return {ok:false, key:'same-'+g, ids:sameGroups[g].map(e=>e.a.id), hints:[
        `Two forces in your diagram that should be exactly the same size aren't.`, h.t2, t3]};
    }
  }
  for (const e of exp){
    if (e.a.val !== undefined){
      if (!valOk(e.a.val, e.val, sc)){
        const o = nm(e.obj), val = fmt(e.val);
        const t2 = e.given
          ? `Check the highlighted force's value in the problem.`
          : `The highlighted force isn't the right size. The problem doesn't give it directly. Use the forces you know and whether ${o} is accelerating — ${sc.level===2 && e.ang%90 ? 'think about the directions along and perpendicular to the surface' : 'think about which forces must balance'}.`;
        const t3 = (e.given ? `The problem gives ${sym(e.label)} = ${val} N.` : e.why) + ` You entered ${fmt(e.a.val)} N.`;
        return {ok:false, key:'val-'+gk(e.a), ids:[e.a.id], hints:[
          `Your forces and directions are right, but at least one size isn't. Check each value you entered.`, t2, t3]};
      }
      continue;
    }
    if (Math.abs(e.a.len - e.len) > LEN_TOL + 1e-9){
      const o = nm(e.obj), S = fmt(sc.scale), val = fmt(e.val);
      const t2 = e.given
        ? `The highlighted arrow isn't drawn to scale. Find this force's value in the problem and divide by the scale (${S} N per dot).`
        : `The highlighted arrow isn't drawn to scale. The problem doesn't give this force directly. Use the forces you know and whether ${o} is accelerating — ${sc.level===2 && e.ang%90 ? 'think about the directions along and perpendicular to the surface' : 'think about which forces must balance'} — then convert to dots (${S} N per dot).`;
      const t3 = (e.given ? `The problem gives ${sym(e.label)} = ${val} N.` : e.why) +
        ` At ${S} N per dot, ${sym(e.label)}${byTxt(e.by)} should be about ${fmtLen(e.len)} dots long. Yours is ${fmtLen(e.a.len)}.`;
      return {ok:false, key:'scale-'+gk(e.a), ids:[e.a.id], hints:[
        `Your forces and directions are right, but at least one arrow isn't drawn to scale. Check each length against the scale: 1 dot = ${S} N.`,
        t2, t3]};
    }
  }
  return {ok:true};
}
function gradeAny(sc, arrows){
  if (LEVELS[sc.level].mode === 'axis') return grade1(sc, arrows.map(a => ({...a, dir: dirOf(a.ang)})));
  return gradeV(sc, arrows);
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* =========================================================
   DRAWING
   ========================================================= */
function grid(c, faint){
  // square grid centered on the object's dot: one square = one dot of length
  const U = Uof(), M = LV().max, x0 = c[0]-M*U, x1 = c[0]+M*U, y0 = c[1]-M*U, y1 = c[1]+M*U;
  const op = faint ? .12 : .18;
  let g = `<g pointer-events="none">`;
  for (let k=-M;k<=M;k++){
    const w = k === 0 ? 1.6 : 1, o = k === 0 ? op*2 : op;
    g += `<line x1="${x0}" y1="${c[1]+k*U}" x2="${x1}" y2="${c[1]+k*U}" stroke="#212529" stroke-width="${w}" opacity="${o}"/>`;
    g += `<line x1="${c[0]+k*U}" y1="${y0}" x2="${c[0]+k*U}" y2="${y1}" stroke="#212529" stroke-width="${w}" opacity="${o}"/>`;
  }
  return g + `</g>`;
}
/* Coordinate axes at each object's center of mass: +x along the acceleration,
   +y perpendicular to it. With zero acceleration, x lies along the surface or
   line of motion (parallel to a ramp; otherwise horizontal). */
function axisInfo(s, i){
  const fs = s.objects[i].forces;
  const ang = f => f.ang !== undefined ? f.ang : {up:90,down:270,left:180,right:0}[f.dir];
  const mag = f => f.val !== undefined ? f.val : f.len;
  let nx = 0, ny = 0, big = 0;
  fs.forEach(f => { const m = mag(f), a = rad(ang(f)); nx += m*Math.cos(a); ny += m*Math.sin(a); big = Math.max(big, m); });
  const n = fs.find(f => f.label === 'FN' && ang(f) % 90 !== 0);
  const surf = fs.find(f => f.label === 'FN' && f.by !== undefined ? s.multi && s.sources.indexOf(f.by) > 0 && !s.objects.some(o => o.name.replace(/^the /,'') === f.by) : f.label === 'FN');
  if (Math.hypot(nx, ny) > 0.04*big){
    if (surf){
      // anything pressed against a fixed surface can only accelerate along that surface
      const along = ang(surf) - 90, d = nx*Math.cos(rad(along)) + ny*Math.sin(rad(along));
      if (Math.abs(d) > 0.02*big) return {ang: norm(Math.round(d > 0 ? along : along + 180)), accel:true};
    }
    let a = norm(Math.atan2(ny, nx)*180/Math.PI);
    // snap away rounding: to the ramp direction or to horizontal/vertical when within 3°
    const targets = [0,90,180,270].concat(n ? [ang(n)-90, ang(n)+90] : []);
    for (const t of targets) if (angDiff(a, t) <= 3) a = norm(t);
    return {ang: norm(Math.round(a)), accel:true};
  }
  if (n) return {ang: norm(ang(n) - 90), accel:false};
  return {ang: 0, accel:false};
}
function axesSvg(c, info){
  // plain dashed axes through the center of mass, no arrowheads, equal length both ways
  const col = 'var(--axis)', L = 46;
  const one = a => {
    const [ux,uy] = vec(a);
    return `<line x1="${c[0]-ux*L}" y1="${c[1]-uy*L}" x2="${c[0]+ux*L}" y2="${c[1]+uy*L}" stroke="${col}" stroke-width="2" stroke-dasharray="5 3" opacity=".95"/>`;
  };
  return `<g pointer-events="none" class="axes">${one(info.ang)}${one(info.ang + 90)}</g>`;
}
function drawGuides(){
  const U = Uof(); let g = '';
  for (const o of sc.objects){
    const [cx,cy] = o.c;
    if (LV().mode === 'axis'){
      for (const d of Object.values(DIRS)) for (let k=1;k<=LV().max;k++)
        g += `<circle cx="${cx+d[0]*k*U}" cy="${cy+d[1]*k*U}" r="2.6" fill="#fff" stroke="#343a40" stroke-width="1" opacity=".75"/>`;
    }   // Level 2: no grid — just the coordinate axes
  }

  for (const o of sc.objects) g += `<circle cx="${o.c[0]}" cy="${o.c[1]}" r="6" fill="#111" stroke="#fff" stroke-width="2"/>`;
  if (sc.scale){

    g += `<g pointer-events="none"><rect x="10" y="398" width="${w}" height="32" rx="7" fill="#fff" stroke="#adb5bd" opacity=".95"/>
      <circle cx="26" cy="414" r="3.2" fill="#fff" stroke="#343a40"/><circle cx="${26+U}" cy="414" r="3.2" fill="#fff" stroke="#343a40"/>
      <path d="M26 406 v-4 h${U} v4" stroke="#343a40" fill="none"/>

}
function layout(){
  const U = Uof(); rendered = []; const groups = {};

  for (const k in groups){
    const list = groups[k];
    list.forEach((a,i) => {
      const [ux,uy] = vec(a.ang), px = -uy, py = ux, c = sc.objects[a.obj].c;
      const off = (i - (list.length-1)/2) * 14;

  }
}
function labelSvg(a, x, y, anchor, col){
  const by = sc.multi && a.by ? `<tspan dy="-5" font-size="11.5" font-style="normal" font-weight="600" fill="#495057"> ${a.by}</tspan>` : '';
  return `<text class="halo" x="${x}" y="${y}" text-anchor="${anchor}" font-size="19" font-weight="700" font-style="italic" fill="${col}">F<tspan font-size="13" dy="5">${LABELS[a.label].sub}</tspan>${by}</text>`;
}
function render(){
  layout(); let h = '';

    const {a,tx,ty,hx,hy,ux,uy,px,py,off} = r;
    const col = flagged.includes(a.id) ? 'var(--flag)' : a.id===selected ? 'var(--sel)' : a.label ? 'var(--arrow)' : '#868e96';
    const bx = hx - ux*14, by = hy - uy*14;
    const head = `${hx},${hy} ${bx+px*8},${by+py*8} ${bx-px*8},${by-py*8}`;
    h += `<g>
      <line x1="${tx}" y1="${ty}" x2="${bx}" y2="${by}" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".85"/>
      <polygon points="${head}" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round" opacity=".85"/>
      <line x1="${tx}" y1="${ty}" x2="${bx}" y2="${by}" stroke="${col}" stroke-width="4.5" stroke-linecap="round"/>
      <polygon points="${head}" fill="${col}"/>`;

      const vert = Math.abs(uy) > .5, leftSide = vert && off < 0, below = !vert && off > 0;

    } else if (Math.abs(uy) < 0.3){

    } else {

      const mag = a.val !== undefined ? `${fmt(a.val)} N` : sc.scale ? `${fmt(r3(a.len*sc.scale))} N` : `${fmtLen(a.len)} dots`;
      const txt = LV().mode === 'axis' ? mag : `${mag} · ${shortAng(a.ang)}`;
      const vert = Math.abs(uy) > .5;
      const rx = hx + (vert ? (ux >= 0 ? -16 : 16) : 0), ry = hy + (vert ? 6 : 34);

      h += `<g pointer-events="none"><rect x="${bx0}" y="${ry-16}" width="${wpx}" height="22" rx="5" fill="#212529" opacity=".88"/>
        <text x="${anchor === 'end' ? rx : anchor === 'start' ? rx : rx}" y="${ry}" text-anchor="${anchor}" font-size="14" font-weight="600" fill="#fff">${txt}</text></g>`;
    }

}

/* =========================================================
   POINTER INTERACTION
   ========================================================= */
function svgPt(e){ const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function segDist(px,py,x1,y1,x2,y2){ const vx=x2-x1, vy=y2-y1, t=Math.max(0,Math.min(1,((px-x1)*vx+(py-y1)*vy)/(vx*vx+vy*vy||1))); return Math.hypot(px-x1-t*vx, py-y1-t*vy); }
function snap(p, obj){
  const U = Uof(), c = sc.objects[obj].c, dx = p.x - c[0], dy = p.y - c[1], d = Math.hypot(dx,dy);
  if (LV().mode === 'axis'){
    const horiz = Math.abs(dx) > Math.abs(dy);
    const ang = horiz ? (dx>0?0:180) : (dy>0?270:90);
    const along = horiz ? Math.abs(dx) : Math.abs(dy);
    return {ang, len: d < U*0.5 ? 0 : Math.max(1, Math.min(LV().max, Math.round(along/U)))};
  }
  let ang = norm(Math.round(Math.atan2(-dy, dx) * 180/Math.PI));
  for (const k of [0,90,180,270,360]) if (Math.abs(ang-k) <= 2) ang = k % 360;
  const len = d < U*0.35 ? 0 : Math.max(0.5, Math.min(LV().max, Math.round(d/U*2)/2));
  return {ang, len};
}
function nearestObj(p){
  let best = 0, bd = Infinity;
  sc.objects.forEach((o,i) => { const d = Math.hypot(p.x-o.c[0], p.y-o.c[1]); if (d < bd){ bd = d; best = i; } });
  return {i:best, d:bd};
}
svg.addEventListener('pointerdown', e => {
  if (phase !== 'draw') return;
  const p = svgPt(e); hidePicker(); $('status').textContent = '';
  if (step === 1){ $('status').textContent = 'First, check the forces that act in the list above, then click "Check forces".'; return; }
  if (step === 3 && typed()){ $('status').textContent = 'Step 3: type each force\'s size in the boxes above — the arrows redraw automatically.'; return; }
  let hit = rendered.find(r => Math.hypot(p.x-r.hx, p.y-r.hy) < 16);
  if (hit){ drag = {a: hit.a, isNew:false, moved:false}; selected = hit.a.id; svg.setPointerCapture(e.pointerId); render(); return; }
  if (step === 3){ $('status').textContent = 'Step 3: drag the tip of an arrow to change its length.'; return; }
  const near = nearestObj(p);
  hit = near.d < 20 ? null : rendered.find(r => segDist(p.x,p.y,r.tx,r.ty,r.hx,r.hy) < 9);
  if (hit){ selected = hit.a.id; render(); showPicker(hit.a); return; }
  if (sc.multi && near.d > 34){ $('status').textContent = 'Start each arrow at the black dot of the object the force acts on.'; return; }
  if (!availableFor(near.i, null).length){ $('status').textContent = `You've already drawn every force you identified${sc.multi ? ' for ' + sc.objects[near.i].name : ''}. Drag a tip to change an arrow, or click an arrow to change or delete it.`; return; }
  const s = snap(p, near.i);
  const a = {id: nextId++, obj: near.i, label:null, by:null, ang:s.ang, len:s.len};
  arrows.push(a); selected = a.id; drag = {a, isNew:true, moved:false};
  svg.setPointerCapture(e.pointerId); flagged = []; render();
});
svg.addEventListener('pointermove', e => {
  if (!drag){
    // hovering over an arrow tip shows that force's magnitude
    const p = svgPt(e), hit = rendered.find(r => Math.hypot(p.x-r.hx, p.y-r.hy) < 16);
    const id = hit ? hit.a.id : null;
    svg.style.cursor = hit ? 'grab' : 'crosshair';
    if (id !== hoverId){ hoverId = id; render(); }
    return;
  }
  const s = snap(svgPt(e), drag.a.obj);
  if (step === 3){   // directions are locked in step 3; only the length changes
    const c = sc.objects[drag.a.obj].c, p = svgPt(e), [ux,uy] = vec(drag.a.ang), U = Uof();
    const along = (p.x-c[0])*ux + (p.y-c[1])*uy, lenSnap = LV().mode === 'axis' ? 1 : 0.5;
    s.ang = drag.a.ang; s.len = Math.max(lenSnap, Math.min(LV().max, Math.round(along/U/lenSnap)*lenSnap));
  }
  if (s.ang !== drag.a.ang || s.len !== drag.a.len){ drag.a.ang = s.ang; drag.a.len = s.len; drag.moved = true; flagged = []; render(); }
});
svg.addEventListener('pointerleave', () => { if (!drag && hoverId !== null){ hoverId = null; render(); } });
svg.addEventListener('pointerup', () => {
  if (!drag) return;
  const a = drag.a, wasNew = drag.isNew, moved = drag.moved; drag = null;
  if (a.len === 0){ arrows = arrows.filter(x => x !== a); selected = null; render(); return; }
  render();
  if (step === 2 && (wasNew || !a.label || !moved)) showPicker(a);
});

/* =========================================================
   LABEL PICKER (type, then — in Level 3 — what exerts it)
   ========================================================= */
function placePicker(a){
  const r = rendered.find(r => r.a === a); if (!r) return;
  const pk = $('picker'); pk.style.display = 'block';
  const ctm = svg.getScreenCTM(), st = $('stage').getBoundingClientRect();
  const pt = svg.createSVGPoint(); pt.x = r.hx; pt.y = r.hy; const sp = pt.matrixTransform(ctm);
  let x = sp.x - st.left + 18, y = sp.y - st.top - 30;
  const w = pk.offsetWidth, h = pk.offsetHeight;
  if (x + w > st.width - 4) x = sp.x - st.left - w - 18;
  x = Math.max(4, x); y = Math.max(4, Math.min(y, st.height - h - 4));
  pk.style.left = x + 'px'; pk.style.top = y + 'px';
}
function availableFor(obj, a){
  // identified forces on this object that don't have an arrow yet (plus this arrow's own)
  return [...checks].filter(k => +k.split('|')[0] === obj &&
    !arrows.some(x => x !== a && keyOf(x.obj,x.label,x.by) === k));
}
function showPicker(a){
  const pk = $('picker'), opts = availableFor(a.obj, a);
  pk.innerHTML = `<div class="ttl">${a.label ? 'Change which force this is' : 'Which force is this?'}${sc.multi ? ` <br>(on ${sc.objects[a.obj].name})` : ''}</div>` +
    opts.map(k => { const [,l,b] = k.split('|'); return `<button data-k="${k}"><span class="s">${sym(l)}</span>${sc.multi ? 'by ' + theBy(b) : LABELS[l].name}</button>`; }).join('') +
    `<button class="del" data-k="__del">Delete arrow</button>`;
  pk.onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.k === '__del'){ arrows = arrows.filter(x => x !== a); selected = null; hidePicker(); render(); return; }
    const [,l,by] = b.dataset.k.split('|'); a.label = l; a.by = sc.multi ? by : null; flagged = [];
    hidePicker(); render();
  };
  placePicker(a);
}
function hidePicker(){ $('picker').style.display = 'none'; }
document.addEventListener('pointerdown', e => { if (!e.target.closest('#picker') && !e.target.closest('#scene')) hidePicker(); });


/* =========================================================
   THREE-STEP FLOW: 1 identify forces, 2 directions, 3 lengths
   ========================================================= */
const keyOf = (obj, label, by, s=sc) => `${obj}|${label}|${s.multi ? by : ''}`;
function expList(s){
  const out = [];
  s.objects.forEach((o,i) => o.forces.forEach(f => out.push({...f, obj:i,
    ang: f.ang !== undefined ? f.ang : {up:90,down:270,left:180,right:0}[f.dir]})));
  return out;
}
const theBy = by => /\b[A-Z0-9]$/.test(by) ? by : 'the ' + by;   // "box A", "rope 1" without "the"
const forceName = (label, by, s=sc) => `${sym(label)}${s.multi && by ? ` <span class="by">by ${theBy(by)}</span>` : ''}`;
function buildCandidates(s){
  if (!s.multi){
    return BASE_LABELS.concat(s.extraLabels || []).map(label => ({obj:0, label, by:null, key:keyOf(0,label,null,s)}));
  }
  const out = [];
  s.objects.forEach((o,i) => {
    const mine = o.forces.map(f => ({obj:i, label:f.label, by:f.by}));
    const have = new Set(mine.map(m => m.label + '|' + m.by));
    const self = o.name.replace(/^the /,'');
    const pool = [];
    const add = (label, by) => { const k = label + '|' + by; if (!have.has(k) && by !== self && !pool.some(p => p.label+'|'+p.by === k)) pool.push({obj:i, label, by}); };
    s.objects.forEach((o2,j) => { if (j !== i) o2.forces.forEach(f => { if (f.label !== 'Fg') add(f.label, f.by); }); });
    if (s.sources.includes('pulley') && o.forces.some(f => f.label === 'FT')) add('FT', 'pulley');
    const surf = o.forces.find(f => f.label === 'FN' && f.by !== 'Earth' && s.sources.indexOf(f.by) > 0);
    if (surf && !o.forces.some(f => f.label === 'Ff')) add('Ff', surf.by);
    if (!o.forces.some(f => f.label === 'Fapp')) { const pusher = s.sources.find(x => /mover|player|parent|worker|custodian|student|child|lifeguard|hand|forklift/.test(x)); if (pusher) add('Fapp', pusher); }
    const picks = shuffle(pool).slice(0, Math.max(2, Math.min(3, pool.length)));
    shuffle(mine.concat(picks)).forEach(c => out.push({...c, key:keyOf(i,c.label,c.by,s)}));
  });
  return out;
}

// ---- Step 1: which forces act? ----
function gradeIdentify(s, chosen){
  const objs = s.objects, multi = s.multi, nm = i => objs[i].name;
  const exp = expList(s), used = new Set();
  for (const e of exp){
    const labs = [e.label, ...(e.alt||[])];
    const k = [...chosen].find(k => { const [o,l,b] = k.split('|'); return +o === e.obj && labs.includes(l) && (!multi || b === e.by) && !used.has(k); });
    if (k){ e.k = k; used.add(k); }
  }
  const extras = [...chosen].filter(k => !used.has(k));
  const missing = exp.filter(e => !e.k);
  if (extras.length){
    const [o,l,b] = extras[0].split('|'), oi = +o, on = nm(oi);
    const alt = !multi && exp.find(e => e.obj === oi && e.k && (e.alt||[]).length && (e.alt||[]).concat(e.label).includes(l));
    if (alt) return {ok:false, key:'id-alt-'+extras[0], keys:[extras[0], alt.k], hints:[1,2,3].map(()=>`You checked two labels for the same force on ${on}. Keep just one of them.`)};
    const wrongBy = multi && missing.find(e => e.obj === oi && e.label === l);
    if (wrongBy) return {ok:false, key:'id-by-'+extras[0], keys:[extras[0]], hints:[
      `Check what exerts each force you chose for ${on}.`,
      `One of the forces you checked for ${on} is the right type, but think again about which object exerts it. What is actually touching ${on} or pulling on it?`,
      `The ${sym(l)} on ${on} is exerted by the ${wrongBy.by}, not the ${b}.`]};
    const sameType = multi && exp.some(e => e.obj === oi && e.label === l);
    const ex = (s.extra && s.extra[l]) ? s.extra[l](on)
      : (sameType && l !== 'Ff') ? `Check what's actually touching ${on}. The ${b} doesn't push or pull directly on ${on}${l === 'FT' ? ' — the string or rope attached to it is what pulls' : ''}.`
      : getG(GENERIC.extra, l)(on);
    return {ok:false, key:'id-extra-'+extras[0], keys:[extras[0]], hints:[
      multi ? `You checked a force that isn't actually acting on ${on}.` : `You checked a force that isn't actually acting on ${on}.`,
      `Look at the highlighted force. For every force you check, you should be able to name the object that exerts it on ${on}. What would be exerting this one?`,
      ex]};
  }
  if (missing.length){
    const e = missing[0], on = nm(e.obj), cnt = missing.filter(m => m.obj === e.obj).length;
    const t3 = (s.missing && s.missing[e.label]) ? s.missing[e.label](on) : getG(GENERIC.missing, e.label)(on);
    return {ok:false, key:'id-missing-'+keyOf(e.obj,e.label,e.by,s), keys:[], hints:[
      `You're missing ${cnt>1 ? cnt+' forces' : 'a force'} on ${on}. Think about everything that could be pushing or pulling on it.`,
      getG(VAGUE_MISSING_T2, e.label)(on),
      t3 + (multi ? ` This force is exerted by the ${e.by}.` : '')]};
  }
  return {ok:true};
}

// ---- Step 2: is every identified force drawn, pointing the right way? ----
function gradeDirections(s, arrs, chosen){
  const multi = s.multi, nm = i => s.objects[i].name, exp = expList(s);
  const need = [...chosen].filter(k => !arrs.some(a => keyOf(a.obj,a.label,a.by,s) === k));
  if (need.length){
    const list = need.map(k => { const [o,l,b] = k.split('|'); return `${forceName(l,b,s)}${multi ? ' on '+nm(+o) : ''}`; }).join(', ');
    return {ok:false, key:'dir-need', ids:[], hints:[1,2,3].map(()=>`Draw an arrow for every force you identified. Still to draw: ${list}.`)};
  }
  for (const a of arrs){
    const e = exp.find(e => e.obj === a.obj && [e.label, ...(e.alt||[])].includes(a.label) && (!multi || e.by === a.by));
    if (e && angDiff(a.ang, e.ang) > ANG_TOL){
      const on = nm(e.obj);
      const base = (s.dirHint && s.dirHint[e.label]) ? s.dirHint[e.label](on) : getG(GENERIC.dir, e.label)(on);
      return {ok:false, key:'dir-'+a.id, ids:[a.id], hints:[
        multi ? `One of the arrows on ${on} points the wrong way.` : `One of your arrows points the wrong way.`,
        `The highlighted arrow points the wrong way. Think about what is exerting that force and which way it pushes or pulls.${/FN/.test(e.label)?' (Where is the surface, and which way is "perpendicular" to it?)':''}`,
        `${base} It should point ${describe(e.ang)}.`]};
    }
  }
  return {ok:true};
}
