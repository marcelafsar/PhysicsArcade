  $('ptext').textContent = `${Math.min(c,GOAL)} / ${GOAL}` + (c>GOAL ? ` (+${c-GOAL})` : '');
}
const snapshot = () => arrows.map(a => ({obj:a.obj, label:a.label, by:a.by, ang:a.ang, len:a.len, val:a.val}));
function submit(){
  if (phase === 'correct'){ nextScenario(); return; }
  hidePicker(); attempts++;
  if (step === 2 && arrows.some(a => !a.label)){
    $('feedback').className = 'feedback bad';
    $('feedback').innerHTML = `<strong>Not quite.</strong>Every arrow needs a label. Click the gray arrow and choose which force it is.`;
    flagged = arrows.filter(a => !a.label).map(a => a.id); render(); attempts--; return;
  }
  if (step === 3 && typed() && arrows.some(a => a.val === undefined)){
    $('feedback').className = 'feedback bad';
    $('feedback').innerHTML = `<strong>Not quite.</strong>Type a size (in newtons) for every force before checking.`;
    flagged = arrows.filter(a => a.val === undefined).map(a => a.id); render(); renderMagPanel(); attempts--; return;
  }
  const r = step === 1 ? gradeIdentify(sc, checks) : step === 2 ? gradeDirections(sc, arrows, checks) : gradeAny(sc, arrows);
  const fb = $('feedback');
  if (r.ok && step < 3){
    Results.record('submit', {scenario: sc.id, step, attempt: attempts, correct: true, arrows: snapshot(), checked: [...checks]});
    const msg = step === 1
      ? `<strong>✓ You found all the forces.</strong>Step 2: draw an arrow for each one, starting at ${sc.multi ? 'the black dot of the object it acts on' : 'the black dot'}. Only the directions are checked in this step.`
      : typed() ? `<strong>✓ All the directions are right.</strong>Step 3: type the size of each force in newtons in the boxes above the picture. Each arrow redraws to scale automatically.`
                : `<strong>✓ All the directions are right.</strong>Step 3: drag each arrow's tip so its length matches the scale (1 dot = ${fmt(sc.scale)} N). The directions are locked now.`;
    if (step === 1){ arrows = []; }
    setStep(step + 1);
    fb.className = 'feedback good'; fb.innerHTML = msg;
    return;
  }
  if (r.ok){
    phase = 'correct'; const counts = wrong === 0, lv = state.level; renderStepper();
    if (counts) state.correct[lv]++;
    Results.record('submit', {scenario: sc.id, step, attempt: attempts, correct: true, counted: counts, arrows: snapshot()});
    flagged = []; selected = null; render();
    fb.className = 'feedback good';
    fb.innerHTML = counts
      ? `<strong>All three steps right on the first try! +1 toward your goal.</strong>${sc.explain}`
      : `<strong>Now it's correct.</strong>${sc.explain}<div class="meta">You needed ${wrong} extra ${wrong === 1 ? 'try' : 'tries'} along the way, so this one doesn't count toward your ${GOAL}. A situation counts when every step is right on the first submit.</div>`;
    submitLabel(true); updateProgress(); renderStepper(); renderMagPanel();
    if (counts && state.correct[lv] === GOAL){
      state.done.add(lv); renderTabs();
      Results.record('level-complete', Results.summary(lv));
      $('donetitle').textContent = lv < LAST ? `Level ${lv} complete!` : 'All levels complete!';
      $('donetext').innerHTML = lv < LAST
        ? `You drew ${GOAL} free body diagrams correctly on the first try. Ready for more? Level ${lv+1} covers ${LEVELS[lv+1].blurb}. You can also pick any level from the buttons at the top.`
        : `You drew ${GOAL} correct diagrams on the first try. You can keep practicing here or pick any level from the buttons at the top.`;
      $('nextLevel').style.display = lv < LAST ? '' : 'none';
      $('nextLevel').textContent = `Go on to Level ${lv+1}`;
      setTimeout(() => { $('done').style.display = 'flex'; }, 700);
    }
  } else {
    hintLevel = (r.key === lastKey) ? Math.min(3, hintLevel + 1) : 1;
    lastKey = r.key; wrong++;
    Results.record('submit', {scenario: sc.id, step, attempt: attempts, correct: false, problem: r.key, hintLevel, arrows: snapshot(), checked: [...checks]});
    flagged = hintLevel >= 2 ? (r.ids || []) : []; flaggedKeys = hintLevel >= 2 ? (r.keys || []) : [];
    render(); renderChecklist(); renderMagPanel();
    fb.className = 'feedback bad';
    const ladder = r.hints[0] !== r.hints[2];
    const lvlTxt = !ladder ? 'Fix your diagram and submit again.' : hintLevel < 3 ? `Hint ${hintLevel} of 3 — the hint gets more specific if you make the same mistake again.` : `Hint 3 of 3.`;
    fb.innerHTML = `<strong>Not quite.</strong>${r.hints[hintLevel-1]}<div class="meta">Attempt ${attempts} · ${lvlTxt}</div>`;
  }
}
$('submit').onclick = submit;
$('clear').onclick = () => {
  if (phase !== 'draw') return;
  if (step === 1){ checks.clear(); flaggedKeys = []; renderChecklist(); return; }
  if (step === 2){ arrows = []; selected = null; flagged = []; hidePicker(); render(); }
};
$('skip').onclick = () => { if (phase === 'draw') Results.record('skip', {scenario: sc.id, attempts}); nextScenario(); };
$('keepGoing').onclick = () => { $('done').style.display='none'; };
$('nextLevel').onclick = () => { $('done').style.display='none'; setLevel(state.level+1); };
document.addEventListener('keydown', e => {
  if ($('done').style.display === 'flex') return;
  if (e.target.tagName === 'SELECT') return;
  if (e.target.type === 'checkbox' && e.key === ' ') return;
  if (e.key === 'Enter'){ e.preventDefault(); submit(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && selected && phase==='draw' && step === 2){
    e.preventDefault(); arrows = arrows.filter(a => a.id !== selected); selected = null; hidePicker(); render();
  } else if (e.key === 'Escape') hidePicker();
});

/* =========================================================
   TEACHER PREVIEW (prototype only)
   ========================================================= */
$('jump').innerHTML = LEVEL_IDS.map(l => `<optgroup label="Level ${l}">` +
  LEVELS[l].bank.map((s,i)=>`<option value="${l}|${s.id}">L${l}.${i+1} ${s.title}</option>`).join('') + `</optgroup>`).join('');
$('jump').onchange = e => {
  const [l,id] = e.target.value.split('|'); const lv = +l;
  state.unlocked.add(lv);
  if (lv !== state.level){ state.level = lv; $('lvlsub').textContent = LEVELS[lv].sub; $('howto').innerHTML = HOWTO[lv].concat(AXES_NOTE).map(t => `<li>${t}</li>`).join(''); renderTabs(); updateProgress(); }
  load(LEVELS[lv].bank.find(s => s.id === id));
};
function solution(s){
  const out = [];
  s.objects.forEach((o,i) => o.forces.forEach(f => out.push({id: nextId++, obj:i, label:f.label, by:f.by || null,
    ang: LEVELS[s.level].mode === 'axis' ? {up:90,down:270,left:180,right:0}[f.dir] : f.ang,
    len: LEVELS[s.level].mode === 'axis' ? f.len : f.len,
    ...(LEVELS[s.level].mode === 'vector' ? {val: f.val} : {})})));
  return out;
}
const solKeys = s => expList(s).map(e => keyOf(e.obj, e.label, e.by, s));
$('showSol').onclick = () => { phase = 'draw'; checks = new Set(solKeys(sc)); arrows = solution(sc); setStep(3); };
$('resetProg').onclick = () => { state.correct = Object.fromEntries(LEVEL_IDS.map(l=>[l,0])); state.done.clear(); renderTabs(); updateProgress(); };

// self-test: every answer key must pass its own grader
(function(){
  const bad = [];
  for (const l of LEVEL_IDS) for (const s of LEVELS[l].bank){
    const prev = state.level; state.level = l;
    const keys = new Set(solKeys(s)), sol = solution(s);
    const cs = buildCandidates(s);
    if (!gradeIdentify(s, keys).ok || !gradeDirections(s, sol, keys).ok || !gradeAny(s, sol).ok || ![...keys].every(k => cs.some(c => c.key === k))) bad.push(`L${l}:${s.id}`);
    state.level = prev;
  }
  const n = LEVEL_IDS.map(l => LEVELS[l].bank.length);
  $('selftest').textContent = bad.length ? `⚠ Answer keys failing: ${bad.join(', ')}` : `✓ ${n.join(' + ')} situations, all answer keys check out`;
  window.__bad = bad;
})();

// Teacher tools stay hidden from students; open the page with #teacher at the end of the link to show them.
function syncTeacher(){ $('teacherPanel').hidden = location.hash !== '#teacher'; }
window.addEventListener('hashchange', syncTeacher); syncTeacher();

// Dark mode: one click to switch; remembered in this browser when possible
function setDark(on){
  document.body.classList.toggle('dark', on);
  $('darkToggle').textContent = on ? '☀️ Light mode' : '🌙 Dark mode';
  try { localStorage.setItem('fbd-dark', on ? '1' : '0'); } catch(_){}
}
$('darkToggle').onclick = () => setDark(!document.body.classList.contains('dark'));
try { if (localStorage.getItem('fbd-dark') === '1') setDark(true); } catch(_){}

setLevel(1);
</script>
